name: stockbill_pro
description: Multi-Business Stock & Billing App — iOS Vibrant Design
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_svg: ^2.0.9
  google_fonts: ^6.1.0
  shared_preferences: ^2.2.2
  intl: ^0.18.1
  fl_chart: ^0.65.0
  path_provider: ^2.1.1
  sqflite: ^2.3.0
  uuid: ^4.2.1
  share_plus: ^7.2.1
  url_launcher: ^6.2.2
  provider: ^6.1.1
  # Uncomment when ready for barcode scanning:
  mobile_scanner: ^3.5.5
  # Uncomment when ready for Bluetooth printing:
  bluetooth_print: ^4.4.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.1
  flutter_launcher_icons: ^0.13.1
  flutter_native_splash: ^2.3.10

flutter:
  uses-material-design: true
  assets:
    - assets/icons/nav/
    - assets/icons/action/
    - assets/icons/business/
    - assets/icons/status/
    - assets/images/


# Launcher Icons Configuration
flutter_icons:
  android: true
  ios: true
  image_path: "assets/icon/app_icon.png"
  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: "assets/icon/app_icon_foreground.png"
  min_sdk_android: 21

# Native Splash Configuration
flutter_native_splash:
  color: "#5856D6"
  image: "assets/icon/app_icon.png"
  branding: "assets/icon/brand.png"
  color_dark: "#1C1C1E"
  image_dark: "assets/icon/app_icon.png"
  branding_dark: "assets/icon/brand.png"
  android_12:
    color: "#5856D6"
    image: "assets/icon/app_icon.png"
