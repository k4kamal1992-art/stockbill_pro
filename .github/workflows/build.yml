name: Build StockBill Pro

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      # ============================================
      # Step 1: Checkout repository
      # ============================================
      - uses: actions/checkout@v4

      # ============================================
      # Step 2: Unzip project (if a zip is present)
      # ============================================
      - name: Unzip project (if a zip is present)
        run: |
          if ls *.zip >/dev/null 2>&1; then
            zipfile=$(ls *.zip | head -n1)
            echo "Extracting $zipfile"
            mkdir -p /tmp/x
            unzip -q "$zipfile" -d /tmp/x -x "*/.github/*" ".github/*"
            count=$(find /tmp/x -mindepth 1 -maxdepth 1 | wc -l)
            top=$(find /tmp/x -mindepth 1 -maxdepth 1 -type d | head -n1)
            if [ "$count" = "1" ] && [ -n "$top" ]; then
              cp -a "$top"/. .
            else
              cp -a /tmp/x/. .
            fi
            rm -f "$zipfile"
            echo "Project extracted successfully."
          else
            echo "No zip found, using files already in the repo"
          fi

      # ============================================
      # Step 3: Setup Java 17
      # ============================================
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # ============================================
      # Step 4: Setup Flutter
      # ============================================
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.24.0'
          cache: true

      - name: Verify Flutter setup
        run: |
          flutter --version
          flutter doctor -v

      # ============================================
      # Step 5: Create Android folder if missing
      # ============================================
      - name: Create Android folder if missing
        run: |
          if [ ! -d android ]; then
            echo "Android folder missing. Adding Android platform with overwrite..."
            flutter create --platforms android --org com.stockbillpro --project-name stockbill_pro --overwrite .
            echo "Android platform added."
          else
            echo "Android folder already exists. Skipping."
          fi

      # ============================================
      # Step 6: Debug - List Android files
      # ============================================
      - name: Debug Android structure
        run: |
          echo "=== Android folder ==="
          ls -la android/ 2>/dev/null || echo "android/ NOT FOUND"
          echo "=== AndroidManifest.xml ==="
          ls -la android/app/src/main/AndroidManifest.xml 2>/dev/null || echo "AndroidManifest.xml NOT FOUND"
          echo "=== build.gradle ==="
          ls -la android/app/build.gradle 2>/dev/null || echo "build.gradle NOT FOUND"
          echo "=== tool folder ==="
          ls -la tool/ 2>/dev/null || echo "tool/ NOT FOUND"

      # ============================================
      # Step 7: Patch Android files
      # ============================================
      - name: Add camera/Bluetooth permissions
        run: |
          python3 tool/patch_android.py

      # ============================================
      # Step 8: Get Flutter dependencies
      # ============================================
      - name: Get Flutter dependencies
        run: flutter pub get

      # ============================================
      # Step 9: Analyze code
      # ============================================
      - name: Analyze
        run: flutter analyze --no-fatal-infos
        continue-on-error: true

      # ============================================
      # Step 10: Run tests
      # ============================================
      - name: Test
        run: flutter test
        continue-on-error: true

      # ============================================
      # Step 11: Build debug APK
      # ============================================
      - name: Build debug APK
        run: flutter build apk --debug --verbose

      # ============================================
      # Step 12: Upload APK artifact
      # ============================================
      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: stockbill-debug-apk
          path: build/app/outputs/flutter-apk/app-debug.apk

      # ============================================
      # Step 13: Upload build logs on failure
      # ============================================
      - name: Upload build logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs
          path: |
            build/
            android/
