name: Build StockBill Pro

on:
  workflow_dispatch:
  push:
    paths:
      - '*.zip'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - uses: actions/checkout@v4

      - name: Unzip project (if a zip is present)
        run: |
          if ls *.zip >/dev/null 2>&1; then
            zipfile=$(ls *.zip | head -n1)
            echo "Extracting $zipfile"

            mkdir -p /tmp/x

            unzip -q "$zipfile" -d /tmp/x \
              -x "*/.github/*" ".github/*"

            count=$(find /tmp/x -mindepth 1 -maxdepth 1 | wc -l)
            top=$(find /tmp/x -mindepth 1 -maxdepth 1 -type d | head -n1)

            if [ "$count" = "1" ] && [ -n "$top" ]; then
              cp -a "$top"/. .
            else
              cp -a /tmp/x/. .
            fi

            rm -f "$zipfile"

            echo "Project extracted successfully."

          else
            echo "No zip found, using files already in the repo"
          fi

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Create Android/iOS folders if missing
        run: |
         if [ ! -d android ]; then
          cp pubspec.yaml pubspec.yaml.bak
           flutter create . \
        --org com.stockbillpro \
          --project-name stockbill_pro
        cp pubspec.yaml.bak pubspec.yaml
      fi

      - name: Add camera/Bluetooth permissions
        run: |
          python3 tool/patch_android.py

      - name: Get Flutter dependencies
        run: |
          flutter pub get

      - name: Analyze
        run: |
          flutter analyze --no-fatal-infos
        continue-on-error: true

      - name: Test
        run: |
          flutter test
        continue-on-error: true

      - name: Build debug APK
        run: |
          flutter build apk --debug

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: stockbill-debug-apk
          path: build/app/outputs/flutter-apk/app-debug.apk
